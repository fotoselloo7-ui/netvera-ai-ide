name: NetVera AI IDE - Windows Desktop Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.0.0'
          run_install: false

      - name: Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PowerShell updater syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("NETVERA-GUNCELLE.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Test updater registry path normalization
        shell: pwsh
        run: |
          . ./scripts/updater-paths.ps1
          $cases = @(
            @{ Value = '  "C:\Program Files\NetVera AI IDE"  '; Expected = 'C:\Program Files\NetVera AI IDE'; DisplayIcon = $false },
            @{ Value = '"C:\Users\pc\AppData\Local\Programs\NetVera AI IDE\NetVera AI IDE.exe",0'; Expected = 'C:\Users\pc\AppData\Local\Programs\NetVera AI IDE\NetVera AI IDE.exe'; DisplayIcon = $true },
            @{ Value = ' "C:\Apps\NetVera AI IDE.exe", -1 '; Expected = 'C:\Apps\NetVera AI IDE.exe'; DisplayIcon = $true }
          )
          foreach ($case in $cases) {
            $actual = ConvertTo-NetVeraWindowsPath -Value $case.Value -DisplayIcon:$case.DisplayIcon
            if ($actual -ne $case.Expected) {
              throw "Updater path mismatch: expected [$($case.Expected)], got [$actual]"
            }
            if (-not (Join-Path -Path $actual -ChildPath 'test.txt')) { throw 'Join-Path failed' }
          }
          foreach ($invalid in @('', 'relative\path', '"C', 'https://example.com/file.exe')) {
            if (ConvertTo-NetVeraWindowsPath -Value $invalid) {
              throw "Invalid registry path accepted: [$invalid]"
            }
          }

      - name: Reproduce multi-run selection in Windows PowerShell 5.1
        shell: powershell
        run: |
          . .\scripts\updater-paths.ps1
          $runJson = '[{"databaseId":43068953007,"headSha":"expected","conclusion":"success","status":"completed"},{"databaseId":43066097064,"headSha":"old","conclusion":"success","status":"completed"},{"databaseId":43065138583,"headSha":"expected","conclusion":"failure","status":"completed"}]'
          $runId = Get-NetVeraSuccessfulRunId -Json $runJson -ExpectedSha 'expected'
          if ($runId -is [array] -or [string]$runId -ne '43068953007') {
            throw "Expected one run ID 43068953007; received [$runId]"
          }
          $noMatch = Get-NetVeraSuccessfulRunId -Json $runJson -ExpectedSha 'missing'
          if ($null -ne $noMatch) { throw "Unmatched build must not select any ID: $noMatch" }
          $oneJson = '[{"databaseId":43068953007,"headSha":"expected","conclusion":"success","status":"completed"}]'
          $singleId = Get-NetVeraSuccessfulRunId -Json $oneJson -ExpectedSha 'expected'
          if ([string]$singleId -ne '43068953007') { throw "Single-run selection failed: $singleId" }
          $invalidJson = '[{"databaseId":"43068953007 43066097064","headSha":"expected","conclusion":"success","status":"completed"}]'
          $rejected = $false
          try { Get-NetVeraSuccessfulRunId -Json $invalidJson -ExpectedSha 'expected' | Out-Null } catch { $rejected = $true }
          if (-not $rejected) { throw 'Concatenated run IDs were not rejected' }

      - name: Verify TypeScript, lint, tests and adapters
        run: pnpm verify

      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis

      - name: Publish Windows preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetVera-AI-IDE-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
